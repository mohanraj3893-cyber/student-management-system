name: Deploy Student Management System to Cloudflare

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Cloudflare Pages, Workers, D1 & R2
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Frontend with Vite
        run: npm run build

      - name: Deploy Frontend to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Notice: CLOUDFLARE_API_TOKEN secret is not configured in GitHub Secrets."
            echo "Skipping direct Wrangler Pages deploy from GitHub Actions."
            echo "If you have connected your GitHub repo directly in Cloudflare Dashboard, Cloudflare automatically deploys on push."
          else
            npx wrangler pages deploy dist --project-name=sms-portal
          fi

      - name: Apply Cloudflare D1 Database Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Notice: CLOUDFLARE_API_TOKEN secret is not configured in GitHub Secrets. Skipping D1 migrations."
          else
            npx wrangler d1 migrations apply sms-db --remote
          fi

      - name: Deploy Cloudflare Worker Backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Notice: CLOUDFLARE_API_TOKEN secret is not configured in GitHub Secrets. Skipping Worker deploy."
          else
            npx wrangler deploy
          fi
