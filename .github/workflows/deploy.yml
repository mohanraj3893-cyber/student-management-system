name: Deploy Student Management System to Cloudflare

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Cloudflare Pages, Workers, D1 & R2
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Frontend with Vite
        run: npm run build

      - name: Verify Cloudflare Secrets Configuration
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::notice title=Cloudflare Credentials::CLOUDFLARE_API_TOKEN secret is not set in GitHub repository secrets. Deployment steps skipped. If you use Cloudflare's direct Git integration, Cloudflare builds and deploys directly from GitHub without needing GitHub Actions."

      - name: Deploy Frontend to Cloudflare Pages
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=sms-portal

      - name: Apply Cloudflare D1 Database Migrations
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply sms-db --remote

      - name: Deploy Cloudflare Worker Backend
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
